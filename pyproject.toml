[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "job-search"
version = "0.1.0"
description = "Harness-agnostic toolbox that automates a tech job search end to end: discover roles, tailor LaTeX resumes and cover letters, draft outreach, research companies, and track applications — with real personal data isolated in a private overlay."
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "jinja2>=3.1.0",
    "pyyaml>=6.0",
    "anthropic>=0.40.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
where = ["."]
include = ["profile*", "resume*", "coverletter*"]

# ── UV (recommended package manager) ─────────────────────────────────────────
# Setup:        uv sync
# Run a script: uv run scripts/build.py --id <id>
# Add package:  uv add <package>
# Lock file:    uv.lock (committed to repo)
[tool.uv]
# No special config needed — uv reads [project.dependencies] automatically
